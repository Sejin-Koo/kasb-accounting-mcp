name: KASB 주간 재크롤링

# KRX Regulation MCP와 동일한 방식: 매주 월요일 02:00(KST, = 일요일 17:00 UTC)에 자동 재크롤링하고,
# 변경 사항이 있으면 자동 commit & push한다. Vercel이 push를 감지해 자동 재배포한다.
# Actions 탭에서 "Run workflow"로 수동 실행도 가능하다.
#
# v2 (2026-07-21): 첫 실행에서 두 가지 문제 발견 후 수정
#  1) python3에 -u(출력 버퍼링 해제)를 안 붙여서 로그가 실시간으로 안 보이던 문제 -> -u 추가
#  2) 크롤러가 전체 완료돼야만 파일을 저장해서, 타임아웃/취소 시 데이터가 통째로 날아가던 문제
#     -> crawl_kasb.py가 기준서/질의회신 단위로 즉시 체크포인트 저장하도록 수정(별도 커밋)
#  3) 위 체크포인트가 의미 있으려면 커밋 스텝이 취소/타임아웃 시에도 실행돼야 하므로 if: always() 추가

on:
  schedule:
    - cron: "0 17 * * 0" # 매주 일요일 17:00 UTC = 월요일 02:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recrawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 전체 크롤링은 기준서 수 x 조문 수 만큼 호출이 많아 시간이 걸릴 수 있음
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 크롤링 실행 (표준 라이브러리만 사용, 의존성 설치 불필요)
        run: python3 -u crawler/crawl_kasb.py

      - name: 변경사항 커밋 & 푸시
        if: always() # 타임아웃/취소로 위 스텝이 중간에 끊겨도, 그때까지 체크포인트된 데이터는 커밋한다
        run: |
          git config user.name "kasb-mcp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: 주간 KASB 데이터 재크롤링 ($(date -u +%Y-%m-%d))"
            git push
          fi
